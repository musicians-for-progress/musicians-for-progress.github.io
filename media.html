        <!--
          Live Instagram feed placeholder.

          GitHub Pages can't run the server-side code Instagram's API
          requires to keep a feed embed working (access tokens expire and
          need periodic refreshing). The practical fix is a free widget
          service that handles that for you — connect your Instagram
          account there, then paste the embed snippet it gives you right
          here in place of the placeholder div below. A few good options:

            - Behold.so
            - LightWidget (lightwidget.com)
            - SnapWidget (snapwidget.com)

          See README.md for more detail.
        -->
        <div class="instagram-embed-slot">
          <p>A live Instagram feed will go here once it's connected — see README.md for setup.</p>
        </div>
